name: production-health

# Public, read-only smoke checks are separate from deploy.yml. A failing probe
# cannot publish anything and never receives production credentials.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: production-health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Probe production
        env:
          PRODUCTION_ORIGIN: https://runtimesignals.tech
          HEALTH_REPORT_PATH: production-health.json
        run: npm run verify:production

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-health-${{ github.run_id }}
          path: production-health.json
          retention-days: 30
