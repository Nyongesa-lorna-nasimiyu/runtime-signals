name: deploy

# Runs on push to main, which — given branch protection is configured to
# require a pull request, the `publication-gate` check, and CODEOWNERS review
# before merge (a required repository setting this workflow does not itself
# enforce; it only re-verifies the outcome) — can only happen via a reviewed,
# checked PR merge. That fact alone is still treated as a hint, not a proof:
# every signal is independently re-verified against the GitHub API for the
# exact commit below, in case branch protection is ever misconfigured or
# disabled. See docs/editorial/publication-gates.md and
# docs/research/architecture-research-report.md launch blocker #4.
#
# Also runs on workflow_dispatch, always against main's current HEAD — this
# is how .github/workflows/scheduled-publish.yml re-triggers a build when
# scheduled content's published_at passes with no new commit to push. The
# commit being (re)built is still whatever most recently merged, so the same
# "find the merged PR, verify its checks and review" logic below resolves
# identically regardless of which trigger fired.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  # Read-only: to look up check-run conclusions and PR review state for the
  # commit being built. Never write access to anything.
  checks: read
  pull-requests: read

concurrency:
  group: deploy-production
  # Never cancel a deploy mid-flight — an interrupted build/deploy is a worse
  # state than a slightly delayed one.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    # Deployment-environment authorization: this job does not start until a
    # human reviewer configured on the `production` GitHub Environment
    # approves the run — configure required reviewers on that environment in
    # repository settings before this workflow is ever exercised for real.
    # scripts/ci/generate-real-approval-manifest.mjs's
    # deployment_environment_authorized: true is only correct because this key
    # already gated everything below it.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # IndexNow diffs github.event.before against github.sha after the
          # deployment. Keep the prior production commit available; the
          # checkout action's default shallow clone contains only github.sha.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the real approval manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPROVAL_MANIFEST_PATH: approval-manifest.production.json
        run: node scripts/ci/generate-real-approval-manifest.mjs "${{ github.sha }}"

      - name: Build against the real manifest
        env:
          APPROVAL_MANIFEST_PATH: approval-manifest.production.json
        run: npm run build

      - name: Draft/future/unapproved/archived exclusion (black-box, real manifest)
        run: node scripts/verify-draft-exclusion.mjs

      - name: Security and cache headers
        run: node scripts/verify-security-headers.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

      # The protected production environment gates access to this credential
      # with its required reviewers. Keep it out of PR and preview workflows.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Only runs once the step above has actually put the build on the live
      # domain - a successful build doesn't mean the corresponding HTML is
      # publicly serving yet (scripts/ci/notify-indexnow.mjs). A `push` event
      # diffs the commit range to find just-changed content; the hourly
      # scheduled-publish workflow re-triggers this via workflow_dispatch
      # against the same commit with no new diff to read (content went live
      # purely because published_at passed), so that path submits every
      # currently-public route instead - IndexNow's endpoint is idempotent
      # about re-submitting already-known URLs, so this is safe, not wasteful
      # in any way that matters at this site's scale.
      # continue-on-error: a transient IndexNow failure is not a failed
      # deploy - the site is already live at this point - and must not make
      # the production workflow go red for something search-engine-side.
      - name: Notify IndexNow of newly public content
        continue-on-error: true
        env:
          INDEXNOW_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          INDEXNOW_FROM_SHA: ${{ github.event.before }}
          INDEXNOW_TO_SHA: ${{ github.sha }}
        run: node scripts/ci/notify-indexnow.mjs
